# Injected into the UBI nginx-122 default server block via
# /opt/app-root/etc/nginx.default.d/ — no wrapping server{} block needed.

location / {
    root /opt/app-root/src;
    index index.html index.htm;
    try_files $uri $uri/ /index.html;
}

# Reverse proxy API requests to backend with SSE streaming support
location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Critical for Server-Sent Events (SSE) streaming
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection '';
    chunked_transfer_encoding on;
    proxy_read_timeout 600s;
}
